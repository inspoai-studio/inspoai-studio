<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Magic wand body -->
  <line x1="5" y1="19" x2="14" y2="10" stroke="#717274" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wand tip highlight -->
  <line x1="14" y1="10" x2="16" y2="8" stroke="#717274" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Sparkle top-right: vertical -->
  <line x1="19" y1="3" x2="19" y2="7" stroke="#717274" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Sparkle top-right: horizontal -->
  <line x1="17" y1="5" x2="21" y2="5" stroke="#717274" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Sparkle small: vertical -->
  <line x1="13" y1="4" x2="13" y2="6" stroke="#717274" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sparkle small: horizontal -->
  <line x1="12" y1="5" x2="14" y2="5" stroke="#717274" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sparkle mid: vertical -->
  <line x1="21" y1="11" x2="21" y2="13" stroke="#717274" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sparkle mid: horizontal -->
  <line x1="20" y1="12" x2="22" y2="12" stroke="#717274" stroke-width="1.5" stroke-linecap="round"/>
</svg>
